[project]
name = "phase-field-ranking"
version = "1.0.0"
description = "Ranking unexplored phase fields by likelihood of hosting a stable compound (PhaseRank), for the LMDS platform"
readme = "README.md"
# The bundled ranking_phase_fields package targets Python <3.11; verified on 3.10.
requires-python = ">=3.10,<3.11"
dependencies = [
    "jsonschema>=4.26.0",
    "boto3>=1.34.0",
    "structlog>=25.5.0",
    # PhaseRank stack. Models are trained at run time (no pickled weights), so
    # versions are not pinned for pickle compatibility — just a working set.
    # The tool uses the modern PyOD API (torch-based AE/VAE); VAE_encoder uses
    # Keras. CPU-only builds keep the image as small as this stack allows.
    "pyod>=2.0",
    "torch>=2.0",
    "tensorflow-cpu>=2.13",
    "tqdm>=4.60",
    "numpy",
    "pandas",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
]

[project.scripts]
model-run = "cmds.run:run_cli"
model-types = "cmds.model_types:main"
validate-model = "cmds.validate_model:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The vendored ranking_phase_fields package carries its reference data
# (data/icsd2017, elemental_features, TABLES) as package data; hatchling ships
# non-.py files under the package automatically.
[tool.hatch.build.targets.wheel]
packages = ["src/cmds", "src/infrastructure", "src/model", "src/ranking_phase_fields"]

# Resolve torch from the CPU-only index — the models run on CPU and the default
# CUDA build would bloat the image by gigabytes.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.uv]
package = true
